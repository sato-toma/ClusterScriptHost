name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    # DependabotのPRも含めて全てのPRで実行

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24]
    defaults:
      run:
        working-directory: ./ts/cluster-comment-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"
          cache-dependency-path: ts/cluster-comment-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run typecheck

      - name: Run build
        run: npm run build

      - name: Run tests
        run: npm test
