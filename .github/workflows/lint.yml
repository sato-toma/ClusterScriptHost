name: ESLint Check

on:
  workflow_dispatch:
  push:
    paths:
      - "ts/cluster-comment-service/**.ts"
      - "ts/cluster-comment-service/**.tsx"
      - "ts/cluster-comment-service/package.json"
      - "ts/cluster-comment-service/package-lock.json"
      - "ts/cluster-comment-service/eslint.config.js"
  pull_request:
    paths:
      - "ts/cluster-comment-service/**.ts"
      - "ts/cluster-comment-service/**.tsx"
      - "ts/cluster-comment-service/package.json"
      - "ts/cluster-comment-service/package-lock.json"
      - "ts/cluster-comment-service/eslint.config.js"

jobs:
  lint:
    name: Run ESLint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Set up Node.js and cache dependencies
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"
          cache-dependency-path: ts/cluster-comment-service/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ts/cluster-comment-service

      - name: Run ESLint
        run: npm run lint
        working-directory: ts/cluster-comment-service
